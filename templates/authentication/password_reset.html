{% extends 'base_auth.html' %}

{% block title %}Password Recovery - Acadify{% endblock %}

{% block auth_content %}
<div class="mb-4">
    <h3 class="fw-bold text-dark mb-1">Reset Password</h3>
    <p class="text-muted small">Enter your registered email address and our administrative desk will assist you with access recovery.</p>
</div>

<form method="POST" action="{% url 'password_reset' %}">
    {% csrf_token %}
    <div class="mb-4">
        <label for="id_email" class="form-label small fw-bold text-dark">Registered Email</label>
        <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted rounded-start-3"><i class="bi bi-envelope"></i></span>
            <input type="email" name="email" id="id_email" required class="form-control py-2 px-3 rounded-end-3" placeholder="name@institution.edu">
        </div>
    </div>

    <button type="submit" class="btn btn-acadify w-100 py-2 justify-content-center">
        <span>Request Recovery</span>
        <i class="bi bi-send-fill"></i>
    </button>

    <div class="text-center mt-4">
        <a href="{% url 'login' %}" class="small text-muted text-decoration-none">
            <i class="bi bi-arrow-left me-1"></i> Back to Login
        </a>
    </div>
</form>
{% endblock %}
